@import "${CONF_ROOT}/internal/conf/settings.conf"

GO_ARCADIA_PROJECT_PREFIX=github.com/ydb-platform/ydb/
YQL_BASE_DIR=yql/essentials
YQL_BASE_TEST_DIR=ydb/library/yql

_PCH_KV=${hide;kv:"p PC"} ${hide;kv:"pc red"}
INCLUDE_EXTS+=.pch

module PCH_LIBRARY: _BASE_UNIT {
    MODULE_PREFIX=
    MODULE_SUFFIX=.pch
    .NODE_TYPE=Library
    SET(MODULE_TYPE LIBRARY)
    .GLOBAL=USER_CXXFLAGS
    .CMD=${tool:"build/scripts/make_pch"} ${CXX_COMPILER} -x c++-header ${input:PCH_PRIVATE_FILE} -Xclang -emit-pch -Xclang -fpch-codegen -Xclang -fpch-debuginfo -Xclang -fpch-instantiate-templates -Xclang -fno-pch-timestamp -Xclang -fmodules-embed-all-files -o $TARGET --relocatable-pch -isysroot ${ARCADIA_BUILD_ROOT} ${C_FLAGS_PLATFORM} $EXTRA_C_FLAGS ${pre=-I:_C__INCLUDE} ${CXXFLAGS} ${CL_MACRO_INFO} ${CL_MACRO_INFO_DISABLE_CACHE__NO_UID__} $_PCH_KV
}

macro USE_PCH(Header, File) {
    SET(PCH_HEADER $Header)
    SET(PCH_FILE $File)
}

macro PCH_LIBRARY_SRC(File) {
    SET(PCH_PRIVATE_FILE $File)
}
